# Ambiente de TESTE/DEMO do BuildToValue numa VPS compartilhada, com Postgres
# DEDICADO. NÃO é o ambiente de piloto (ver deploy-vps.md §"o que NÃO satisfaz").
#
# Invariantes (não mudam): migração one-shot com o PAPEL DE MIGRAÇÃO antes da
# api subir (service_completed_successfully); api e worker conectam com app_api
# (sem BYPASSRLS); Postgres SEM portas publicadas.
#
# Nada de nginx de borda aqui: a VPS já tem o `global-ingress-gateway` em 80/443.
# Plugamos nele pela forma (a) REDE COMPARTILHADA: `api` e `console` entram
# também na rede externa `btv-prod-net`, onde o gateway faz proxy POR NOME DE
# CONTAINER (btv-platform-api / btv-platform-console). `postgres` e `worker`
# NUNCA saem da rede interna. Blocos prontos: deploy/ingress-plataforma.conf;
# passo a passo: docs/runbooks/deploy-plataforma-vps.md.
name: buildtovalue

services:
  # Postgres DEDICADO. SEM ports publicadas (regra dura: nada de banco em
  # 0.0.0.0). Volume nomeado. Enxuto — começa apertado (ajuste sob carga).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app_migrator # dono do banco = papel de migração
      POSTGRES_PASSWORD: ${MIGRATOR_PASSWORD:?defina no .env}
      POSTGRES_DB: buildtovalue
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
      - -c
      - work_mem=4MB
    volumes:
      - btv_pgdata:/var/lib/postgresql/data
    networks: [btv_internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app_migrator -d buildtovalue']
      interval: 5s
      timeout: 3s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: '0.5'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    restart: unless-stopped

  # Migração ONE-SHOT com o PAPEL DE MIGRAÇÃO. A api/worker só sobem depois
  # (service_completed_successfully). Forward-only.
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile.migrate }
    environment:
      DATABASE_MIGRATION_URL: postgres://app_migrator:${MIGRATOR_PASSWORD:?}@postgres:5432/buildtovalue
    depends_on:
      postgres: { condition: service_healthy }
    networks: [btv_internal]
    restart: 'no'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    # Nome FIXO: é por ele que o ingress da VPS resolve o upstream na rede
    # compartilhada (`proxy_pass http://btv-platform-api:3000`).
    container_name: btv-platform-api
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      API_HOST: 0.0.0.0 # dentro do container; o mapeamento abaixo prende no host
      API_PORT: '3000'
      # app_api (sem BYPASSRLS) — é o que garante o isolamento por tenant.
      DATABASE_URL: postgres://app_api:app_api_dev@postgres:5432/buildtovalue
      JWT_SECRET: ${JWT_SECRET:?defina no .env (>=32)}
      FIELD_KEY_SECRET: ${FIELD_KEY_SECRET:?defina no .env (>=16)}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    ports:
      # SÓ localhost — a internet chega pelo ingress, na rede compartilhada.
      # Esta porta existe para diagnóstico no host (curl /ready), não para o proxy.
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [btv_internal, btv_edge]
    # node:22-slim não tem curl nem wget — o teste usa o fetch do próprio Node.
    # /ready checa o banco e responde 503 se degradado (routes/health.ts).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    restart: unless-stopped

  # Worker: SEM porta publicada, conexão DIRETA ao Postgres (LISTEN/NOTIFY não
  # funciona atrás de pooler em transaction mode). /metrics fica interno.
  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.worker }
    container_name: btv-platform-worker
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgres://app_api:app_api_dev@postgres:5432/buildtovalue
      WORKER_API_BASE: http://api:3000
      JWT_SECRET: ${JWT_SECRET:?}
      FIELD_KEY_SECRET: ${FIELD_KEY_SECRET:?}
      # §A: resolvedor de secret:// (env|file). O AIProvider real resolve o
      # ponteiro do tenant_ai_config no runtime — a chave NUNCA fica no banco.
      SECRET_BACKEND: ${SECRET_BACKEND:-env}
      SECRET_DIR: ${SECRET_DIR:-/run/secrets/btv}
      # Taxa USD→BRL (config, NÃO cotação de rede) — a tabela de preço da DeepSeek
      # é em USD; sem taxa, um modelo USD faz parada honesta (fx-missing).
      FX_USD_BRL: ${FX_USD_BRL:-5.40}
    volumes:
      # A chave real vive no HOST (SECRET_HOST_DIR), montada READ-ONLY no SECRET_DIR
      # do container. NUNCA no repo nem no banco. Sem este mount, o backend `file`
      # não enxerga o arquivo. Mantenha SECRET_DIR = alvo do mount.
      - ${SECRET_HOST_DIR:-./secrets}:${SECRET_DIR:-/run/secrets/btv}:ro
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [btv_internal]
    # /metrics do worker (porta interna, nunca publicada) serve de liveness: se o
    # processo morreu, nada responde. Não prova o loop, prova o processo.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.WORKER_METRICS_PORT??9100)+'/metrics').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    restart: unless-stopped

  # Console — SPA estático servido por nginx próprio da imagem. NÃO fala com o
  # banco: só existe na rede de borda, e as chamadas /v1 do browser vão pelo
  # ingress (o cliente usa baseUrl relativa, mesmo domínio da api).
  console:
    build: { context: .., dockerfile: deploy/Dockerfile.console }
    container_name: btv-platform-console
    networks: [btv_edge]
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost/']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: '0.25'
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
    restart: unless-stopped

  # Seed do DEMO — ONE-OFF, só sob demanda (`--profile seed`). Reusa o STAGE
  # builder da api (tem tsx + o script), então não polui as imagens de runtime.
  #   docker compose --profile seed run --rm seed
  seed:
    profiles: ['seed']
    build: { context: .., dockerfile: deploy/Dockerfile.api, target: builder }
    working_dir: /repo
    command: ['pnpm', '--filter', '@platform/api', 'run', 'seed:demo']
    environment:
      DATABASE_URL: postgres://app_api:app_api_dev@postgres:5432/buildtovalue
      DATABASE_MIGRATION_URL: postgres://app_migrator:${MIGRATOR_PASSWORD:?}@postgres:5432/buildtovalue
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    networks: [btv_internal]
    restart: 'no'

volumes:
  btv_pgdata:

networks:
  # Rede INTERNA — Postgres e worker vivem SÓ aqui, nunca alcançáveis de fora.
  btv_internal:
    driver: bridge
  # Rede de BORDA, criada e mantida pelo global-ingress (external: true — este
  # compose nunca a cria nem a remove). Só `api` e `console` entram nela; é onde
  # o btv-nginx-prod resolve os upstreams por nome de container.
  btv_edge:
    name: btv-prod-net
    external: true
