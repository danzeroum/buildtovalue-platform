# ============================================================================
# plataforma.buildtovalue.cloud — blocos para o global-ingress da VPS.
#
# ESTE ARQUIVO NÃO É LIDO POR NINGUÉM AUTOMATICAMENTE. O ingress vive fora
# deste repo, em /opt/btv/ingress/nginx/nginx.conf (montado read-only no
# container btv-nginx-prod). Copie os blocos abaixo para DENTRO do `http { }`
# de lá, na ordem descrita, e recarregue.
#
# Ordem obrigatória (o nginx NÃO SOBE apontando para um certificado que não
# existe — e derrubar o gateway derruba todos os outros domínios):
#   1. cole SÓ o bloco A (listen 80)  → nginx -t → reload
#   2. emita o certificado (certbot webroot)
#   3. cole o bloco B (listen 443)    → nginx -t → reload
# Passo a passo completo: docs/runbooks/deploy-plataforma-vps.md §4.
#
# Upstreams por NOME DE CONTAINER, resolvidos pelo DNS interno do Docker
# (o nginx.conf já tem `resolver 127.0.0.11`). O `set $var` antes do
# proxy_pass é o que permite o gateway subir mesmo com a stack parada —
# sem ele, um upstream ausente é erro de configuração e o nginx recusa.
# Os proxy_set_header comuns (Host, X-Real-IP, X-Forwarded-*, Upgrade) já
# estão no nível `http` do nginx.conf e valem aqui — não repita.
# ============================================================================

# ---- BLOCO A · ACME + redirect (colar no passo 1) --------------------------
server {
    listen 80;
    server_name plataforma.buildtovalue.cloud;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---- BLOCO B · aplicação (colar no passo 3, com o cert já emitido) ---------
server {
    listen 443 ssl;
    server_name plataforma.buildtovalue.cloud;

    ssl_certificate     /etc/letsencrypt/live/plataforma.buildtovalue.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plataforma.buildtovalue.cloud/privkey.pem;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff always;

    # Varredura de bots. NOTE o ponto em `\.env`: nos outros blocos deste
    # gateway o padrão está como `env` solto, que casa com QUALQUER caminho
    # contendo a sequência "env" em qualquer posição. Num app com rotas e
    # querystrings geradas isso vira 444 silencioso. Aqui só o arquivo.
    location ~* (wp-login|login\.cgi|\.git|\.env) { return 444; }

    # Prometheus da api — interno. `location =` é exato e o nginx o avalia
    # ANTES de qualquer regex, então isto realmente barra o vazamento.
    location = /metrics { return 404; }

    # API: contrato /v1 + liveness/readiness. X-Request-Id propagado nos dois
    # sentidos para correlacionar o log do cliente com o da api.
    location ~ ^/(v1|health|ready)(/|$) {
        set $up_btv_api "http://btv-platform-api:3000";
        proxy_pass $up_btv_api;
        proxy_set_header X-Request-Id $http_x_request_id;
        proxy_pass_header X-Request-Id;
        client_max_body_size 20M;
        proxy_read_timeout 120s;
    }

    # Console (SPA). O try_files das rotas do react-router é feito pelo nginx
    # de dentro da imagem do console — aqui é proxy puro.
    location / {
        set $up_btv_console "http://btv-platform-console:80";
        proxy_pass $up_btv_console;
    }
}
