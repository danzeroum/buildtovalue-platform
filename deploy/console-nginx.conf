# nginx DE DENTRO da imagem do console — não confundir com o ingress da VPS
# (esse é `deploy/ingress-plataforma.conf`). Aqui só se serve o build estático:
# quem roteia /v1 para a api é o ingress, no mesmo domínio.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Estáticos do Vite têm hash no nome — cacheáveis para sempre.
    location ~* \.(js|css|woff2?|png|jpe?g|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: qualquer rota do react-router cai no index.html. O index NUNCA é
    # cacheado — senão um deploy novo continua servindo os hashes antigos.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
